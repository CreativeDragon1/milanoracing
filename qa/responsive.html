<!doctype html><html><head><title>Milano responsive QA</title><style>body{margin:0;background:#ddd;font:14px Arial}header{padding:12px;display:flex;gap:15px;align-items:center}select,button{padding:8px}iframe{display:block;border:0;margin:0 auto;background:white;height:820px}#result{white-space:pre-wrap;max-width:900px;margin:20px auto}</style></head><body><header><label>Width <select id="width"><option>390</option><option>320</option><option>768</option><option>1280</option></select></label><label>Route <select id="route"><option value="/">Home</option><option value="/evolution">Car Evolution</option><option value="/team">Team</option><option value="/team#team-kit">Kit viewer</option><option value="/journal">Journal</option><option value="/partners">Partners</option><option value="/partners#partnerships">Partnership plans</option><option value="/evolution#charts">Engineering charts</option><option value="/journal/livery">Livery article</option><option value="/journal/jersey">Jersey article</option><option value="/journal/drag-log">Engineering article</option><option value="/not-a-page">404</option></select></label><button id="sweep">Test all routes and sizes</button><button id="sponsors">Check sponsor equality</button><button id="audit">Check layout</button></header><iframe title="Responsive website preview" src="/" width="390"></iframe><pre id="result"></pre><script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>frame.width=e.target.value;document.querySelector('#route').onchange=e=>frame.src=e.target.value;document.querySelector('#audit').onclick=()=>{const d=frame.contentDocument;const w=frame.contentWindow;document.querySelector('#result').textContent=JSON.stringify({route:w.location.pathname,width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),heading:d.querySelector('h1')?.textContent,carFrames:[...d.querySelectorAll('.compare-preview')].map(el=>({width:el.clientWidth,height:el.clientHeight,ratio:el.clientWidth/el.clientHeight})),comparisonCards:[...d.querySelectorAll('.compare-card')].map(el=>({width:el.clientWidth,height:el.clientHeight})),links:[...d.querySelectorAll('a')].filter(a=>!a.getAttribute('href')).length},null,2)};document.querySelector('#sweep').onclick=async()=>{const results=[];const routes=['/','/evolution','/team','/journal','/partners','/journal/livery','/journal/jersey','/journal/drag-log','/not-a-page'];for(const width of [320,390,768,1280]){frame.width=width;for(const route of routes){await new Promise(resolve=>{frame.onload=resolve;frame.src=route});const d=frame.contentDocument;await new Promise(resolve=>{if(d.querySelector('h1'))return resolve();const mo=new MutationObserver(()=>{if(d.querySelector('h1')){mo.disconnect();resolve()}});mo.observe(d,{subtree:true,childList:true})});await d.fonts.ready;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));results.push({route,width,overflow:d.documentElement.scrollWidth>frame.contentWindow.innerWidth,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length,h1:d.querySelectorAll('h1').length});document.querySelector('#result').textContent=JSON.stringify(results,null,2)}}document.querySelector('#result').dataset.complete='true';};
document.querySelector('#sponsors').onclick=async()=>{
 const results=[];document.querySelector('#result').dataset.complete='false';
 for(const width of [320,390,600,768,1000,1280,1600]){frame.width=width;
  for(const route of ['/','/partners']){
   await new Promise(resolve=>{frame.onload=resolve;frame.src=route});
   const d=frame.contentDocument;
   await new Promise(resolve=>{if(d.querySelector('.partner-logo'))return resolve();const mo=new MutationObserver(()=>{if(d.querySelector('.partner-logo')){mo.disconnect();resolve()}});mo.observe(d,{subtree:true,childList:true})});
   await d.fonts.ready;
   await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
   const elements=[...d.querySelectorAll(route==='/'?'.partner-logo-link':'.partner-equal-card')];
   const sizes=elements.map(el=>{const b=el.getBoundingClientRect();const logo=el.querySelector('.partner-logo').getBoundingClientRect();return {name:el.querySelector('.partner-logo').getAttribute('aria-label'),width:b.width,height:b.height,logoWidth:logo.width,logoHeight:logo.height,inside:b.left>=0&&b.right<=frame.contentWindow.innerWidth,visible:frame.contentWindow.getComputedStyle(el).visibility==='visible',link:el.matches('a')?el.href:el.querySelector('a').href}});
   const equal=(key)=>Math.max(...sizes.map(s=>s[key]))-Math.min(...sizes.map(s=>s[key]))<1;
   results.push({route,width,count:sizes.length,equalWidths:equal('width'),equalHeights:equal('height'),equalLogoSlots:equal('logoWidth')&&equal('logoHeight'),allVisible:sizes.every(s=>s.visible&&s.inside),overflow:d.documentElement.scrollWidth>frame.contentWindow.innerWidth,sponsors:sizes});
   document.querySelector('#result').textContent=JSON.stringify(results,null,2);
  }
 }
 document.querySelector('#result').dataset.complete='true';
};</script></body></html>
