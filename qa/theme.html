<!doctype html><html><head><title>Milano theme QA</title><style>body{margin:0;background:#303641;color:#fff;font:14px Arial}header{padding:12px;display:flex;gap:12px}button{padding:12px}iframe{display:block;border:0;height:850px;background:#111;margin:auto}pre{white-space:pre-wrap;padding:20px}</style></head><body><header><button id="run">Check both themes</button><button id="deep">Check dark controls and charts</button></header><iframe title="Theme preview" width="1280" src="/"></iframe><pre id="result">Ready</pre><script>
const f=document.querySelector('iframe'),out=document.querySelector('#result');
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function load(route,width,theme){f.width=width;await new Promise(r=>{f.onload=r;f.src=route});let d=f.contentDocument;for(let i=0;i<100&&!d.querySelector('h1');i++)await pause(50);await d.fonts.ready;const sel=d.querySelector('[aria-label="Appearance"]');sel.value=theme;sel.dispatchEvent(new f.contentWindow.Event('change',{bubbles:true}));await pause(250);const css=d.createElement('style');css.textContent='.scroll-reveal{opacity:1!important;transform:none!important}';d.head.append(css);return d;}
const rgb=s=>(s.match(/[\d.]+/g)||[]).map(Number);
const mix=(a,b)=>{let k=a[3]??1;return [0,1,2].map(i=>a[i]*k+b[i]*(1-k));};
const lum=c=>{let v=c.slice(0,3).map(x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4});return v[0]*.2126+v[1]*.7152+v[2]*.0722};
function audit(d){const w=f.contentWindow;const failures=[];for(const el of d.querySelectorAll('h1,h2,h3,h4,p,a,button,label,span,small,dt,dd,summary,th,td,time')){const text=[...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent.trim()).join(' ').trim();if(!text||!el.getClientRects().length||el.closest('[hidden],[aria-hidden="true"],.sr-only,.orange.period')||el.disabled)continue;const s=w.getComputedStyle(el);if(s.visibility==='hidden'||+s.opacity===0)continue;let chain=[],skip=false;for(let n=el;n;n=n.parentElement){const c=w.getComputedStyle(n);if(c.backgroundImage!=='none'||+c.opacity<.99){skip=true;break;}chain.push(rgb(c.backgroundColor));}if(skip)continue;let bg=[255,255,255];chain.reverse().forEach(c=>bg=mix(c,bg));let fg=mix(rgb(s.color),bg),l1=lum(fg),l2=lum(bg),ratio=(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);const size=parseFloat(s.fontSize),large=size>=24||(size>=18.66&&parseInt(s.fontWeight)>=700);if(ratio<(large?3:4.5)-.05)failures.push({text:text.slice(0,65),selector:el.className,ratio:+ratio.toFixed(2),fg:s.color,bg});}return {route:w.location.pathname,width:w.innerWidth,theme:d.documentElement.dataset.theme,overflow:d.documentElement.scrollWidth>w.innerWidth,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),contrastFailures:failures};}
document.querySelector('#run').onclick=async()=>{out.dataset.complete='false';let results=[];for(const theme of ['light','dark'])for(const width of [320,768,1280])for(const route of ['/','/evolution','/team','/journal','/partners','/journal/livery','/journal/jersey','/journal/drag-log','/not-a-page']){const d=await load(route,width,theme);results.push(audit(d));out.textContent=JSON.stringify(results,null,2);}out.dataset.complete='true';};
document.querySelector('#deep').onclick=async()=>{out.dataset.complete='false';const d=await load('/evolution',1280,'dark'),results=[];d.querySelector('#tab-V1').click();d.querySelector('.archive-toolbar>button').click();await pause(600);results.push(audit(d));for(const b of d.querySelectorAll('.ec-switcher button')){b.click();await pause(120);const details=d.querySelector('.ec-data-tools details');details.open=true;results.push({...audit(d),chart:b.textContent,strokes:[...d.querySelectorAll('.ec-curve')].map(p=>f.contentWindow.getComputedStyle(p).stroke)});}out.textContent=JSON.stringify(results,null,2);out.dataset.complete='true';};
</script></body></html>
